<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>SketchUp Pipe Probe</title>
<style>
body{font:14px 'Malgun Gothic',sans-serif;margin:22px;background:#f4f6f9;color:#1c293b}
h1{font-size:22px;margin:0 0 4px}p{line-height:1.5}.card{background:white;border:1px solid #d9e0e9;border-radius:8px;padding:14px;margin:14px 0}
button{padding:9px 12px;margin:4px;border:1px solid #aebaca;background:white;border-radius:5px;cursor:pointer}
.primary{background:#214fbd;color:white}.stop{background:#b32636;color:white}button:disabled{opacity:.4;cursor:default}
pre{white-space:pre-wrap;word-break:break-all;font:12px Consolas,monospace}#error{color:#b32636}progress{width:100%;height:20px}
</style></head><body>
<h1>SketchUp Pipe Probe <small id="version"></small></h1>
<p>0.4.0 시험 배포 · 모델 조회 / 선택 / 화면 / 속성 / 이동</p>
<div class="card"><b id="connection">초기화 중</b><pre id="identity"></pre>
<button onclick="act('connect')">연결 / 자동 재연결</button><button onclick="act('disconnect')">연결 해제</button>
<button id="ping" onclick="act('ping')">GUI로 한글 Ping</button></div>
<div class="card"><b id="authority">사용자 제어</b><p>조회는 별도 허가 없이 가능합니다. 선택·화면·객체 변경은 아래 실행 허가가 필요합니다. SketchUp 편집 조작을 마친 상태에서 허용하세요. 객체 변경은 명령당 한 번의 Undo로 되돌릴 수 있습니다.</p>
<button id="grant" class="primary" onclick="act('grant')">MCP 명령 실행 허용</button>
<button onclick="act('revoke')">사용자 제어로 회수</button>
<p id="job">대기</p><progress id="progress" max="100" value="0"></progress>
<button class="stop" onclick="act('stop')">작업 중지 + 제어권 회수</button></div>
<pre id="result"></pre><pre id="error"></pre><button onclick="act('clear')">오류 표시 지우기</button>
<script>
function act(name){sketchup.action(name);}
window.renderState=function(s){
 document.getElementById('version').textContent=s.extension_version||'';
 document.getElementById('connection').textContent='GUI: '+s.connection+' | MCP: '+((s.mcp_clients||[]).map(function(c){return c.name;}).join(', ')||'연결 대기');
 document.getElementById('identity').textContent='PID: '+s.pid+' | SketchUp '+s.sketchup_version+' | Ruby '+s.ruby_version+' ('+s.pointer_bits+'bit)\n세션: '+s.session_id+'\n모델: '+(s.title||'제목 없음')+'\n경로: '+(s.path||'미저장');
 document.getElementById('authority').textContent=s.authority==='mcp'?'MCP 명령 실행 허용 중':'사용자 제어';
 document.getElementById('grant').disabled=s.connection!=='connected'||s.authority==='mcp';
 document.getElementById('ping').disabled=s.connection!=='connected';
 document.getElementById('job').textContent=s.job_id?'시험 작업: '+s.progress+'% · '+s.job_id:'대기';
 document.getElementById('progress').value=s.progress;
 document.getElementById('result').textContent=s.last_result||'';
 document.getElementById('error').textContent=[s.transport_error,s.last_error].filter(Boolean).join('\n');
};
</script></body></html>
